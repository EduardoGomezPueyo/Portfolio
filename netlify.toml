[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Optimised images and bundled assets have hashed filenames, so they can be cached forever
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Spanish version removed: send old /es URLs to their English equivalents
[[redirects]]
  from = "/es/showcase"
  to = "/work"
  status = 301

[[redirects]]
  from = "/es/work/sakura-sushi"
  to = "/"
  status = 301

[[redirects]]
  from = "/es/work/linkarms"
  to = "/"
  status = 301

[[redirects]]
  from = "/es"
  to = "/"
  status = 301

[[redirects]]
  from = "/es/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/case-studies"
  to = "/"
  status = 301
